[package]
name = "sglang-kv-types"
description = "Protobuf messages and the tonic gRPC client and server for SGLang's sglang.kv.v1 KV cache event service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository = "https://github.com/sgl-project/sglang"
homepage = "https://docs.sglang.io"
readme = "README.md"
keywords = ["sglang", "grpc", "protobuf", "llm", "inference"]
categories = ["api-bindings"]
include = ["src/**", "README.md"]

# No [package.metadata.sglang]: not a Python extension; wheel builds skip it.

[lib]
name = "sglang_kv_types"
crate-type = ["rlib"]

[dependencies]
prost = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
