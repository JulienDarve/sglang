syntax = "proto3";
package sglang.kv.v1;

// KV cache events of the scheduler, as its ZMQ publisher emits them
// (`python/sglang/srt/disaggregation/kv_events.py`), with the same sequence
// numbers. The messages are shared with vLLM's `vllm` package so that one
// client handles both engines; fields marked "vLLM" are never set by SGLang.
service KvEvents {
  // One stream per data-parallel rank; each Rust listener serves its own rank.
  //
  // The first response is `start`; every later one is a `batch`, in
  // sequence-number order, each number once. Without `resume`, the stream
  // starts with the next batch the server forwards. With `resume`, it first
  // replays the engine's buffered batches from the cursor (the scheduler keeps
  // `buffer_steps` of them), then continues live.
  //
  // Each batch is one message, however large; raise the client's receive
  // limit above gRPC's default 4 MiB for long prompts.
  //
  // INVALID_ARGUMENT: this listener does not serve the rank.
  // FAILED_PRECONDITION: the scheduler publishes no KV cache events over ZMQ.
  // OUT_OF_RANGE: the cursor's batches are no longer buffered, or its
  //   `stream_id` is not the current one.
  // DATA_LOSS: batches after the last one sent can no longer be recovered
  //   from the engine's buffer.
  // UNAVAILABLE: the engine's replay socket did not answer, the relay
  //   stopped, or the server is shutting down.
  rpc SubscribeKvEvents(SubscribeKvEventsRequest) returns (stream SubscribeKvEventsResponse);

  // Streams the blocks that this listener's rank holds in its device cache
  // (medium `GPU`), as the stores that recreate them: applied in order to an
  // empty state, they give the state after every batch before `end.resume`.
  // A block follows its parent. A block whose parent is not held is left out,
  // so a client that loaded the snapshot lacks it, also once the parent is
  // stored again. The last response is `end`; a stream that ends without it
  // is not a snapshot. To follow the cache from the snapshot, subscribe with
  // `end.resume`, or subscribe before the call and drop the batches below
  // `end.resume`: the snapshot holds every batch forwarded before the call.
  //
  // INVALID_ARGUMENT: this listener does not serve the rank.
  // FAILED_PRECONDITION: the scheduler publishes no KV cache events over ZMQ,
  //   or `grpc_snapshot` is false in its KV events config.
  // UNAVAILABLE: the snapshot is behind the stream (retry), or the server is
  //   shutting down.
  rpc GetKvSnapshot(GetKvSnapshotRequest) returns (stream GetKvSnapshotResponse);
}

message SubscribeKvEventsRequest {
  uint32 data_parallel_rank = 1;
  optional KvEventCursor resume = 2;       // absent: live batches only
}

// A cursor past the newest batch is accepted and waits for that number; an
// empty `stream_id` gives up the detection of a server restart.
message KvEventCursor {
  string stream_id = 1;                    // empty: the current stream
  uint64 next_sequence_number = 2;
}

message SubscribeKvEventsResponse {
  oneof item {
    KvEventStreamStart start = 1;          // always first
    KvEventBatch batch = 2;
  }
}

message KvEventStreamStart {
  string stream_id = 1;                    // changes when the server restarts
  uint32 data_parallel_rank = 2;
}

message GetKvSnapshotRequest {
  uint32 data_parallel_rank = 1;
}

message GetKvSnapshotResponse {
  oneof item {
    KvSnapshotBlocks blocks = 1;
    KvSnapshotEnd end = 2;                 // always last
  }
}

// `session_id` is never set on these stores: it describes a store event, not
// a block.
message KvSnapshotBlocks {
  repeated BlockStored stored = 1;
}

// `complete` is false when the server missed batches, so the snapshot may lack
// blocks the cache holds or hold blocks the cache dropped; it is true again
// once the engine clears its cache.
message KvSnapshotEnd {
  KvEventCursor resume = 1;                // the first batch the snapshot does not include
  bool complete = 2;
}

// Mirrors the engine's EventBatch: [ts, events, rank], plus the ZMQ sequence frame.
message KvEventBatch {
  uint64 sequence_number = 1;              // the engine publisher's own number, same as on ZMQ
  double ts = 2;
  optional uint32 data_parallel_rank = 3;  // vLLM data_parallel_rank; SGLang attn_dp_rank
  repeated KvCacheEvent events = 4;
}

message KvCacheEvent {
  oneof event {
    BlockStored block_stored = 1;
    BlockRemoved block_removed = 2;
    AllBlocksCleared all_blocks_cleared = 3;
  }
}

message BlockHash {
  oneof value {
    uint64 unsigned_value = 1;             // vLLM integer hashes (default)
    int64 signed_value = 2;                // SGLang
    bytes digest = 3;                      // vLLM with integer hashes turned off
  }
}

message BlockTokenIds {
  oneof ids {
    TokenIdList single = 1;
    TokenIdPairList pairs = 2;             // SGLang EAGLE pages
  }
}
message TokenIdList { repeated uint64 token_ids = 1; }
message TokenIdPairList { repeated TokenIdPair pairs = 1; }
message TokenIdPair { uint64 first = 1; uint64 second = 2; }

message BlockStored {
  repeated BlockHash block_hashes = 1;
  BlockHash parent_block_hash = 2;         // unset for a root block
  BlockTokenIds token_ids = 3;             // flat across all blocks in the event
  uint32 block_size = 4;
  optional int64 lora_id = 5;              // deprecated in both engines, kept for parity
  optional string medium = 6;
  optional string lora_name = 7;
  optional string session_id = 8;
  optional string cache_salt = 9;          // SGLang
  repeated BlockMmRoutingSpans mm_routing_spans = 10;  // SGLang, one per block
  repeated BlockExtraKeys extra_keys = 11;             // vLLM, one per block
  optional uint32 group_idx = 12;          // vLLM
  optional string kv_cache_spec_kind = 13; // vLLM
  optional uint32 kv_cache_spec_sliding_window = 14;   // vLLM
  optional string locality = 15;           // vLLM
  optional string ownership = 16;          // vLLM
  repeated TokenIdList lookahead_token_ids = 17;       // vLLM, one per block
  bool reuse_report = 18;                  // vLLM: reports reused blocks, stores none
}

message BlockRemoved {
  repeated BlockHash block_hashes = 1;
  optional string medium = 2;
  optional uint32 group_idx = 3;           // vLLM
  optional string locality = 4;            // vLLM
  optional string ownership = 5;           // vLLM
}

message AllBlocksCleared {}

// vLLM extra_keys, untagged as published: LoRA name, (mm_identifier, offset),
// cache salt, prompt-embedding digests.
message BlockExtraKeys { repeated ExtraKeyValue keys = 1; }
message ExtraKeyValue {
  oneof value {
    string text = 1;
    bytes data = 2;
    int64 integer = 3;
    ExtraKeyTuple tuple = 4;
  }
}
message ExtraKeyTuple { repeated ExtraKeyValue items = 1; }

message BlockMmRoutingSpans { repeated MmRoutingSpan spans = 1; }
message MmRoutingSpan { uint64 start = 1; uint64 length = 2; string label = 3; }
